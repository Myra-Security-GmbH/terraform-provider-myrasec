# This GitHub action builds a draft release for the given version. It is
# started manually (Actions -> release -> Run workflow) on master and builds
# the current HEAD of master.
#
# The tag is only created locally and not pushed: GitHub creates it when the
# draft gets published, so tag and release (with checksums) appear together,
# which the OpenTofu registry requires.
#
# This uses an action (crazy-max/ghaction-import-gpg) that assumes you set your
# private key in the `GPG_PRIVATE_KEY` secret and passphrase in the `PASSPHRASE`
# secret. If you would rather own your own GPG handling, please fork this action
# or use an alternative one for key handling.
#
# You will need to pass the `--batch` flag to `gpg` in your signing step
# in `goreleaser` to indicate this is being used in a non-interactive mode.
#
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without leading "v" (e.g. 1.86.0)'
        required: true
        type: string
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      # Set explicitly, since an older tag may point to the same commit
      GORELEASER_CURRENT_TAG: v${{ inputs.version }}
    steps:
      -
        name: Validate input
        # "Run workflow" offers every branch, but only master may be released.
        # GoReleaser would accept e.g. "1.86" and publish a non-semver tag
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Releases are built from master only, not from '$GITHUB_REF'"
            exit 1
          fi
          if ! [[ "$GORELEASER_CURRENT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '${GORELEASER_CURRENT_TAG#v}', expected e.g. 1.86.0"
            exit 1
          fi
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Check version is higher than the last release
        # Catches typos like 1.68.0 instead of 1.86.0, which would publish new
        # code under an old version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0)
          # -C -u: fails unless the list is strictly ascending
          if ! printf '%s\n' "$LAST_TAG" "$GORELEASER_CURRENT_TAG" | sort -VCu; then
            echo "::error::Version ${GORELEASER_CURRENT_TAG#v} must be higher than the last release ${LAST_TAG#v}"
            exit 1
          fi
      -
        name: Create local tag (not pushed, fails if it already exists)
        run: git tag "$GORELEASER_CURRENT_TAG"
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      -
        name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@releases/v5
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v4
        with:
          version: latest
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # GitHub sets this automatically
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
